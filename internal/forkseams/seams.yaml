# Seams the fork guards. Each entry names symbols of one package that only
# the listed files may use, so a fresh session cannot reach them by accident.
# forkseams_test.go reads this file; `make check` runs it. To add a seam,
# add an entry; to let another file use one, add it to `allowed` with the
# reason in the commit. Tests (_test.go files) are not checked.
seams:
  - name: no-prompt passcode store
    package: github.com/DIYgod/pinky/internal/secret
    symbols:
      - NewAgentPINs
      - NewAgentPINsOn
    allowed:
      - cmd/pinky/autounlock.go
      - cmd/pinky/phone_pin.go
    fix: "get the passcode through gateway.Options.PIN, which cmd/pinky/autounlock.go wires; only the daemon wiring and the `phone pin` verbs build the store. If another file really needs it, add it to `allowed` in internal/forkseams/seams.yaml in the same commit and say why."
  - name: no-prompt login store
    package: github.com/DIYgod/pinky/internal/secret
    symbols:
      - NewAgentLogins
    allowed:
      - cmd/pinky/phone_login.go
    fix: "the agents' own account passwords are read only through `agentLogins` in cmd/pinky/phone_login.go, which `phone login` and `phone fill -account` use. If another file really needs the store, add it to `allowed` in internal/forkseams/seams.yaml in the same commit and say why."
  - name: no-prompt login store variable
    package: github.com/DIYgod/pinky/cmd/pinky
    idents:
      - agentLogins
    allowed:
      - cmd/pinky/phone_login.go
      - cmd/pinky/phone_fill.go
    fix: "only phone_login.go (the `phone login` verbs) and phone_fill.go (`phone fill -account`) name the store. If another file really needs one, add it to `allowed` in internal/forkseams/seams.yaml in the same commit and say why."
  - name: no-prompt passcode store variables
    package: github.com/DIYgod/pinky/cmd/pinky
    idents:
      - autoUnlockPINs
      - phonePINs
    allowed:
      - cmd/pinky/autounlock.go
      - cmd/pinky/phone_pin.go
    fix: "the store's builder variables are named only by cmd/pinky/autounlock.go (the daemon) and cmd/pinky/phone_pin.go (the `phone pin` verbs). Another file gets a passcode through gateway.Options.PIN. If another file really needs one, add it to `allowed` in internal/forkseams/seams.yaml in the same commit and say why."
  - name: secret vault
    package: github.com/DIYgod/pinky/internal/vault
    symbols:
      - New
      - Listen
    allowed:
      - cmd/pinky/secrets.go
    fix: "the vault is built and given its socket only by the daemon wiring in cmd/pinky/secrets.go; everything else gets it as gateway.Options.Secrets. If another file really needs one, add it to `allowed` in internal/forkseams/seams.yaml in the same commit and say why."
  - name: secret staging
    package: github.com/DIYgod/pinky/internal/vault
    symbols:
      - StageSecret
    allowed:
      - cmd/pinky/phone_secret.go
      - cmd/pinky/phone_fill.go
    fix: "secrets are staged only by `pinkyctl phone secret put` (cmd/pinky/phone_secret.go), which the owner's credential broker runs, and by `phone fill -account` (cmd/pinky/phone_fill.go), which stages a password the owner saved once for the agents' own account. If another file really needs it, add it to `allowed` in internal/forkseams/seams.yaml in the same commit and say why."
  - name: secret hand-out
    package: github.com/DIYgod/pinky/internal/vault
    methods:
      - TakeSecret
    allowed:
      - internal/gateway/secrets.go
    fix: "a staged secret leaves the vault only in internal/gateway/secrets.go, just before the driver types it. If another file really needs it, add it to `allowed` in internal/forkseams/seams.yaml in the same commit and say why."
  - name: secret store input
    package: github.com/DIYgod/pinky/internal/vault
    methods:
      - Deposit
    allowed: []
    fix: "values enter the vault only through its socket (internal/vault/socket.go), so the credential broker's staging is the one way in. If another file really needs Deposit, add it to `allowed` in internal/forkseams/seams.yaml in the same commit and say why."
  - name: code slot writer
    package: github.com/DIYgod/pinky/internal/gateway
    methods:
      - keepShownCode
    allowed:
      - internal/gateway/codeslot.go
    fix: "a one-time code enters the per-lease slot only from the raw read, before masking: keepCodeOf in internal/gateway/codeslot.go, called by observeOCR. If another read path really needs it, add its file to `allowed` in internal/forkseams/seams.yaml in the same commit and say why."
  - name: code slot hand-out
    package: github.com/DIYgod/pinky/internal/gateway
    methods:
      - takeCode
    allowed:
      - internal/gateway/secrets.go
    fix: "a shown code leaves the slot only in internal/gateway/secrets.go (secretText), just before the driver types it, like a staged secret. If another file really needs it, add it to `allowed` in internal/forkseams/seams.yaml in the same commit and say why."
  - name: interrupt book user files
    package: github.com/DIYgod/pinky/internal/interrupt
    symbols:
      - UserFiles
    allowed:
      - cmd/pinky/interrupts.go
    fix: "the user's interrupt entries are read from $PINKY_HOME/interrupts.d only at daemon start, in cmd/pinky/interrupts.go, which hands the loaded book to gateway.Options.Interrupts. If another file really needs them, add it to `allowed` in internal/forkseams/seams.yaml in the same commit and say why."
  - name: credential trigger writer
    package: github.com/DIYgod/pinky/internal/gateway
    methods:
      - markCredentialTyped
    allowed:
      - internal/gateway/secrets.go
    fix: "the credential_typed trigger that lets a consent entry fire is set only where a staged secret is handed to the driver, internal/gateway/secrets.go (secretText). If another file really needs to set it, add it to `allowed` in internal/forkseams/seams.yaml in the same commit and say why."
